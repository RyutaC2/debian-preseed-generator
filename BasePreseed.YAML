# Debian 13.5 / amd64 / netinst / サーバー用のPreseed YAML設計案
# 採用範囲の具体的な項目・選択肢を収録。このスキーマの読込・cfg生成は未実装。
# schema_versionはツール独自の形式の版。Debianの版ではない。
#
# 方針:
# - YAMLに表示名・候補・固定値・質問／出力条件を保持する。
# - GoがHuhの質問、検証、導出、ハッシュ化、text/templateによるcfg出力を担当する。
# - answer.kindはselect / multiselect / input / text / boolean / none。
# - noneは質問なし。value、value_from、value_resolverのいずれかで値を決める。
# - hiddenは入力のマスク、confirmは確認入力。両方とも秘密値をログに残さない。
# - 固定値valueと初期値defaultを区別する。未指定と空文字列も区別する。
# - preseedはowner / key / typeと値を明示。空配列はUI専用の設定。
# - 条件が偽なら質問と出力を省略。親を変更したら依存する回答を再検証する。
# - whenは{setting, equals}、{all: [...]}, {any: [...]}, {not: ...}。
#   attributeがあれば選択されたcatalog候補の属性を比較する。
# - *_resolverはGo側の登録済み処理名。inputsの値はsetting idへの参照。
#   resolver_optionsは固定引数。任意のGo式やシェル式は評価しない。
# - choices_fromはcatalog名。choices_resolverは登録済みの候補絞り込み。
# - navigationは複数のHuh Selectを組み合わせる専用フロー。Huh標準のYAML機能ではない。
# - validation / transformもGo側の登録済み処理。追加実装が必要。
# - multiselectの連結は各出力のseparatorに従う。booleanはtrue/falseで出力。
# - kernel/image、UID、初期グループ、IPv6など採用しないキーは出力しない。
#
schema_version: 1
status: draft
target:
  debian_version: '13.5'
  codename: trixie
  architecture: amd64
  media: netinst
  purpose: server
  media_filename: debian-13.5.0-amd64-netinst.iso
scope:
  decided:
    localization: 本家に似た言語・地域・キーボード選択。国は階層選択を含む
    network: 有線。DHCP または固定 IPv4
    accounts: root のみ / root と一般ユーザー / 一般ユーザーと sudo
    passwords: 非表示入力・確認入力後、SHA-512 crypt で出力
    timezone: 国に応じた初期候補を提示し、変更可能。UTC も選択可能
    hardware_clock: UTC として扱う設定を質問せず出力
    ntp: インストール中の同期。有効 / 無効を選択。既定は有効
    ntp_server: 既定サーバー、または任意のサーバーを入力
    disk: 対象ディスクを明示入力し、ディスク全体を使用
    partitioning: 通常のパーティション / LVM。レイアウトは本家の既定レシピから選択
    lvm_size: 全容量 / 容量指定 / 割合指定
    use_mirror: 使用する / しないを選択。既定は使用する
    mirror: deb.debian.org を初期値とし、任意のホスト・ディレクトリへ変更可能
    http_proxy: 任意入力。空欄なら使用しない
    mirror_suite: trixie を質問せず出力
    apt_services: security / updates を複数選択。既定は両方有効
    non_free_firmware: 有効 / 無効を選択。既定は有効
    contrib: 有効 / 無効を選択。既定は無効
    non_free: 有効 / 無効を選択。既定は無効
    scan_additional_media: 追加メディアの走査を行わない設定を質問せず出力
    tasks: 標準ユーティリティ / SSH サーバー / Web サーバーを複数選択。既定は標準ユーティリティ
    additional_packages: パッケージ名を空白区切りで任意入力
    install_recommends: 推奨パッケージをインストールする設定を質問せず出力
    kernel: インストーラーの自動選択を使用
    package_upgrade: none / safe-upgrade / full-upgrade を選択。既定は none
    popularity_contest: パッケージ利用統計の送信は無効を質問せず出力
    bootloader: GRUB をインストール。インストール先は OS の対象ディスクを基準に設定
    boot_mode: UEFI / BIOS はインストーラーの起動方式に合わせる
    finish_action: 再起動 / 停止 / 電源 OFF を選択。既定は再起動
    eject_media: メディア取り出しの有効 / 無効を選択。既定は有効
    finish_message: 最後の完了メッセージで質問せず進む設定を出力
    late_command: 終了直前の独自コマンドを任意の複数行入力。空欄なら出力しない
    preseed_loading: ローカルファイル / URL の両方を想定
    generated_artifacts: cfg と読み込み方法に応じた起動引数の例を出力
    url_static_network: URL 取得前に必要な固定 IPv4 設定を起動引数の例へ含める
    additional_locales: 任意の複数選択。既定は追加なし
    keyboard_toggle: 非ラテン配列の切替が必要な場合だけ質問
    user_uid: Debian の既定値を使用
    user_groups: Debian の既定値を使用
  deferred:
  - IPv6 の設定 UI
  - 無線ネットワーク設定
  - ディスク暗号化・RAID・独自レシピ・空き領域のみの使用
  - 独自 APT リポジトリ・multiarch
  - GRUB パスワード・追加カーネル引数
  - 読み込み直後・ディスク分割前の独自コマンド
  - 別の Preseed ファイルの読み込み・外部スクリプト実行
  - インストーラーへの SSH 接続
  - ISO の再作成・Preseed 配布サーバーの構築
  - 一般ユーザーの UID・初期グループの指定
  pending: []
sources:
  installation_guide: https://www.debian.org/releases/trixie/amd64/apbs04.en.html
  loading_guide: https://www.debian.org/releases/trixie/amd64/apbs02.en.html
  iso: https://cdimage.debian.org/mirror/cdimage/archive/13.5.0/amd64/iso-cd/debian-13.5.0-amd64-netinst.iso
  iso_package_list: https://cdimage.debian.org/mirror/cdimage/archive/13.5.0/amd64/list-cd/debian-13.5.0-amd64-netinst.list.gz
  catalog_data:
  - package: localechooser
    version: '2.112'
    files:
    - usr/share/localechooser/languagelist
    - usr/share/localechooser/languagelist.data.gz
    - etc/SUPPORTED-short
    - DEBIAN/templates
  - package: console-setup-udeb
    version: 1.242~deb13u1
    files:
    - DEBIAN/templates
    - usr/share/console-setup/keyboard-configuration.config
  - package: tzsetup-udeb
    version: 0.132+deb13u1
    files:
    - DEBIAN/templates
    - usr/share/tzsetup/tzmap
  - package: tzdata
    version: 2026b-0+deb13u1
    files:
    - usr/share/zoneinfo/zone.tab
    - usr/share/zoneinfo/
  - package: locales
    version: 2.41-12+deb13u3
    files:
    - usr/share/i18n/SUPPORTED
  - package: partman-auto
    version: '177'
    files:
    - lib/partman/recipes-amd64/
    - lib/partman/recipes-amd64-efi/
  - package: grub-installer
    version: '1.212'
    files:
    - usr/bin/grub-installer
  - package: user-setup-udeb
    version: '1.107'
    files:
    - usr/bin/user-setup-ask
    - usr/lib/user-setup/reserved-usernames
  notes:
  - 言語・国・基本キーボードは13.5 ISOのinitrd内のデータを使用。
  - tzdata・localesは13.5 ISO内のdebから取得。その他のudebはISO収録版と同じ版。
  - 日本語の表示名は収録テンプレートに従う。一部の候補は英語表示のまま。
  - 言語一覧の既定localeがSUPPORTED-shortにない場合は本家のfallbackに従う（eo.UTF-8→eo）。元値はsource_default_localeに保存。
  - 'tzsetupの候補のうち13.5のtzdataに存在しない旧名は除外: Canada/East-Saskatchewan, Mexico/Hermosillo, Mexico/Cancun'
  - trixieのオンライン文書は更新される。mirror/suite=trixieは13.5時点のパッケージ固定を意味しない。
groups:
- id: localization
  label: 言語・国／地域・キーボード
- id: network
  label: 有線ネットワーク
- id: accounts
  label: アカウント
- id: clock
  label: 時計
- id: storage
  label: ディスク・パーティション
- id: apt
  label: ミラー・APT
- id: packages
  label: パッケージ
- id: bootloader
  label: GRUB
- id: finish
  label: 終了動作
- id: advanced
  label: 終了直前コマンド
- id: loading
  label: Preseedの読み込み
settings:
- id: language
  group: localization
  label: インストール時の言語
  help: 全78候補。minimum_display_level=4は本家のGTK等のレベル4環境、3はフレームバッファ等のレベル3以上の環境が必要。候補一覧は全件保持する。
  answer:
    kind: select
    choices_from: languages
    validation:
    - rule: required
  preseed:
  - owner: d-i
    key: debian-installer/language
    type: string
    value_from: language
- id: country
  group: localization
  label: 国・地域
  answer:
    kind: select
    choices_from: countries
    navigation:
      handler: country_hierarchy
      language_from: language
      regions_from: regions
      shortlist_attribute: country_shortlist
      country_regions_attribute: regions
      other_label: その他
    default_resolver:
      name: language_default_country
      inputs:
        language: language
    validation:
    - rule: required
  preseed:
  - owner: d-i
    key: debian-installer/country
    type: string
    value_from: country
- id: locale
  group: localization
  label: システムのlocale
  help: 一意なら質問せず決定。言語と国の組合せに候補がなければ、言語に対応するlocaleから選択。Cは非ローカライズ。
  answer:
    kind: select
    choices_resolver:
      name: locale_candidates
      inputs:
        language: language
        country: country
    default_resolver:
      name: locale_default
      inputs:
        language: language
        country: country
    auto_if_single: true
    validation:
    - rule: required
  preseed:
  - owner: d-i
    key: debian-installer/locale
    type: string
    value_from: locale
- id: additional_locales
  group: localization
  label: 追加で生成するlocale
  when:
    not:
      setting: locale
      equals: C
  answer:
    kind: multiselect
    choices_from: locales
    default: []
    choices_filter:
      exclude_value_from: locale
  preseed:
  - owner: d-i
    key: localechooser/supported-locales
    type: multiselect
    value_from: additional_locales
    separator: ', '
- id: keyboard_layout
  group: localization
  label: キーボード配列
  answer:
    kind: select
    choices_from: keyboard_layouts
    validation:
    - rule: required
  preseed:
  - owner: d-i
    key: keyboard-configuration/xkb-keymap
    type: select
    value_from: keyboard_layout
- id: keyboard_toggle
  group: localization
  label: 配列を切り替えるキー
  when:
    setting: keyboard_layout
    equals: true
    attribute: requires_toggle
  answer:
    kind: select
    choices_from: keyboard_toggles
    default: Alt+Shift
  preseed:
  - owner: d-i
    key: keyboard-configuration/toggle
    type: select
    value_from: keyboard_toggle
- id: network_interface
  group: network
  label: インストール先の有線NIC（auto または名前）
  help: 生成ツールを実行しているPCのNIC一覧は使わない。autoは本家のリンク検出による自動選択。
  answer:
    kind: input
    default: auto
    validation:
    - rule: required
    - rule: network_interface
  preseed:
  - owner: d-i
    key: netcfg/choose_interface
    type: select
    value_from: network_interface
- id: static_ipv4
  group: network
  label: '固定IPv4を設定しますか？（いいえ: DHCP）'
  answer:
    kind: boolean
    default: false
  preseed:
  - owner: d-i
    key: netcfg/disable_autoconfig
    type: boolean
    value_from: static_ipv4
- id: ipv4_address
  group: network
  label: IPv4アドレス
  when:
    setting: static_ipv4
    equals: true
  answer:
    kind: input
    validation:
    - rule: required
    - rule: ipv4_unicast
  preseed:
  - owner: d-i
    key: netcfg/get_ipaddress
    type: string
    value_from: ipv4_address
- id: ipv4_netmask
  group: network
  label: IPv4ネットマスク
  when:
    setting: static_ipv4
    equals: true
  answer:
    kind: input
    validation:
    - rule: required
    - rule: ipv4_netmask
  preseed:
  - owner: d-i
    key: netcfg/get_netmask
    type: string
    value_from: ipv4_netmask
- id: ipv4_gateway
  group: network
  label: 'ゲートウェイ（空欄: なし）'
  when:
    setting: static_ipv4
    equals: true
  answer:
    kind: input
    validation:
    - rule: optional_ipv4_unicast
    default: ''
  preseed:
  - owner: d-i
    key: netcfg/get_gateway
    type: string
    value_from: ipv4_gateway
    transform: empty_to_none
- id: ipv4_nameservers
  group: network
  label: DNSサーバーのIPv4（空白区切り・空欄可）
  when:
    setting: static_ipv4
    equals: true
  answer:
    kind: input
    validation:
    - rule: ipv4_list
    default: ''
  preseed:
  - owner: d-i
    key: netcfg/get_nameservers
    type: string
    value_from: ipv4_nameservers
    transform: normalize_space_list
- id: confirm_static
  group: network
  label: confirm_static
  when:
    setting: static_ipv4
    equals: true
  answer:
    kind: none
    value: true
  preseed:
  - owner: d-i
    key: netcfg/confirm_static
    type: boolean
    value_from: confirm_static
- id: hostname
  group: network
  label: ホスト名
  help: 選んだホスト名をDHCPや逆引きの結果より優先する。
  answer:
    kind: input
    validation:
    - rule: required
    - rule: hostname_label
  preseed:
  - owner: d-i
    key: netcfg/get_hostname
    type: string
    value_from: hostname
  - owner: d-i
    key: netcfg/hostname
    type: string
    value_from: hostname
- id: domain
  group: network
  label: ドメイン名（空欄可）
  help: get_domainはDHCPが返すドメインを上書きしない。IPv6はOS側で無効化しない。
  answer:
    kind: input
    default: ''
    validation:
    - rule: optional_dns_name
  preseed:
  - owner: d-i
    key: netcfg/get_domain
    type: string
    value_from: domain
- id: root_login
  group: accounts
  label: rootアカウントを有効にしますか？
  help: 無効なら一般ユーザーを必ず作成し、本家の処理でsudoを利用可能にする。
  answer:
    kind: boolean
  preseed:
  - owner: d-i
    key: passwd/root-login
    type: boolean
    value_from: root_login
- id: make_user
  group: accounts
  label: 一般ユーザーを作成しますか？
  when:
    setting: root_login
    equals: true
  answer:
    kind: boolean
    default: true
  preseed: []
- id: create_user
  group: accounts
  label: 一般ユーザー作成の決定値
  answer:
    kind: none
    value_resolver:
      name: create_normal_user
      inputs:
        root_login: root_login
        make_user: make_user
  preseed:
  - owner: d-i
    key: passwd/make-user
    type: boolean
    value_from: create_user
- id: root_password
  group: accounts
  label: rootパスワード
  when:
    setting: root_login
    equals: true
  answer:
    kind: input
    hidden: true
    confirm: true
    validation:
    - rule: required
  preseed:
  - owner: d-i
    key: passwd/root-password-crypted
    type: password
    value_from: root_password
    transform: sha512_crypt
- id: user_fullname
  group: accounts
  label: 一般ユーザーの氏名（空欄可）
  when:
    setting: create_user
    equals: true
  answer:
    kind: input
    default: ''
    validation:
    - rule: single_line
  preseed:
  - owner: d-i
    key: passwd/user-fullname
    type: string
    value_from: user_fullname
- id: username
  group: accounts
  label: 一般ユーザー名
  when:
    setting: create_user
    equals: true
  answer:
    kind: input
    validation:
    - rule: required
    - rule: pattern
      value: ^[a-z][-a-z0-9_]{0,31}$
    - rule: not_in_catalog
      catalog: reserved_usernames
  preseed:
  - owner: d-i
    key: passwd/username
    type: string
    value_from: username
- id: user_password
  group: accounts
  label: 一般ユーザーのパスワード
  when:
    setting: create_user
    equals: true
  answer:
    kind: input
    hidden: true
    confirm: true
    validation:
    - rule: required
  preseed:
  - owner: d-i
    key: passwd/user-password-crypted
    type: password
    value_from: user_password
    transform: sha512_crypt
- id: timezone
  group: clock
  label: タイムゾーン
  answer:
    kind: select
    choices_from: timezones
    navigation:
      handler: timezone_by_country
      country_from: country
      all_label: すべての地域
      include:
      - UTC
    default_resolver:
      name: country_default_timezone
      inputs:
        country: country
    validation:
    - rule: required
  preseed:
  - owner: d-i
    key: time/zone
    type: string
    value_from: timezone
- id: hardware_clock_utc
  group: clock
  label: hardware_clock_utc
  answer:
    kind: none
    value: true
  preseed:
  - owner: d-i
    key: clock-setup/utc
    type: boolean
    value_from: hardware_clock_utc
- id: ntp
  group: clock
  label: インストール中にNTPで時刻同期しますか？
  answer:
    kind: boolean
    default: true
  preseed:
  - owner: d-i
    key: clock-setup/ntp
    type: boolean
    value_from: ntp
- id: ntp_server_mode
  group: clock
  label: NTPサーバー
  when:
    setting: ntp
    equals: true
  answer:
    kind: select
    default: installer
    choices:
    - label: 本家の既定サーバー
      value: installer
    - label: 指定する
      value: custom
  preseed: []
- id: ntp_server
  group: clock
  label: NTPサーバーのホスト名またはIP
  when:
    all:
    - setting: ntp
      equals: true
    - setting: ntp_server_mode
      equals: custom
  answer:
    kind: input
    validation:
    - rule: required
    - rule: host_or_ip
  preseed:
  - owner: d-i
    key: clock-setup/ntp-server
    type: string
    value_from: ntp_server
- id: target_disk
  group: storage
  label: インストール対象ディスク
  help: '例: /dev/sda, /dev/vda, /dev/nvme0n1。指定ディスクの既存領域を削除して全体を使用する。生成側では対象ディスクの存在・容量を判定できない。'
  answer:
    kind: input
    validation:
    - rule: required
    - rule: linux_whole_disk_path
  preseed:
  - owner: d-i
    key: partman-auto/disk
    type: string
    value_from: target_disk
- id: partition_method
  group: storage
  label: パーティション方式
  answer:
    kind: select
    choices:
    - label: 通常のパーティション
      value: regular
    - label: LVM
      value: lvm
  preseed:
  - owner: d-i
    key: partman-auto/method
    type: string
    value_from: partition_method
- id: partition_recipe
  group: storage
  label: パーティションのレイアウト
  help: ファイルシステム・swap容量・EFI/BIOS用の領域は13.5の組込みレシピに従う。容量不足はインストーラーでエラーとなる。
  answer:
    kind: select
    choices_from: partition_recipes
    default: atomic
  preseed:
  - owner: d-i
    key: partman-auto/choose_recipe
    type: select
    value_from: partition_recipe
- id: lvm_size_mode
  group: storage
  label: LVMに使用する容量
  when:
    setting: partition_method
    equals: lvm
  answer:
    kind: select
    default: max
    choices:
    - label: 全容量
      value: max
    - label: 容量を指定
      value: size
    - label: 割合を指定
      value: percentage
  preseed: []
- id: lvm_size_amount
  group: storage
  label: 'LVM容量（例: 20 GB）'
  when:
    all:
    - setting: partition_method
      equals: lvm
    - setting: lvm_size_mode
      equals: size
  answer:
    kind: input
    validation:
    - rule: required
    - rule: partman_capacity
  preseed: []
- id: lvm_size_percentage
  group: storage
  label: LVMに使用する割合（1〜100）
  when:
    all:
    - setting: partition_method
      equals: lvm
    - setting: lvm_size_mode
      equals: percentage
  answer:
    kind: input
    validation:
    - rule: integer
      minimum: 1
      maximum: 100
  preseed: []
- id: lvm_guided_size
  group: storage
  label: LVM容量の決定値
  when:
    setting: partition_method
    equals: lvm
  answer:
    kind: none
    value_resolver:
      name: lvm_guided_size
      inputs:
        mode: lvm_size_mode
