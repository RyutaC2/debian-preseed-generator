# 専用処理の契約。ここにある処理名をGo側で実装する。
handlers:
  country_hierarchy: >-
    言語のcountry_shortlistがあればその国と「その他」を表示する。
    その他はregionsから地域、countries.regionsにその地域を含む国を順に選ぶ。
    shortlistがなければdefault_countryの地域の国一覧を最初に表示し、他地域へ戻れるようにする。
    default_countryがないC等は地域選択から始める。最終回答は国コードのみ。
  language_default_country: "選択言語のdefault_country。nullなら初期選択なし。"
  locale_candidates: >-
    language=CならCのみ。それ以外はlocalechooserのget_default_localeに従い、
    選択言語のdefault_localeの接尾辞を保持したlanguage_COUNTRY候補、接尾辞なし候補を確認する。
    言語コードは最初の_まで（zh_CN→zh、pt_BR→pt）。
    適合する候補があれば一意に決定。なければその言語の対応localeを候補にする。
    既定国と既定localeの言語部が異なる場合は本家と同じfallbackを使う。
  locale_default: "適合するlocaleを優先。なければ言語のdefault_localeを初期候補にする。"
  timezone_by_country: "国に対応する候補とUTCを表示。すべての地域からも選択可能。"
  country_default_timezone: "countries.default_timezone。未定義の国ではUTCを初期候補にする。"
  create_normal_user: "root_login=falseならtrue。trueならmake_userの回答値。"
  lvm_guided_size: "mode=maxならmax、sizeならamount、percentageなら整数文字列に%を付ける。"
  finish_flag: "haltフラグはaction=haltまたはpoweroffでtrue。poweroffフラグはaction=poweroffでtrue。"
  sha512_crypt: "暗号学的な乱数saltでSHA-512 cryptを生成。確認入力を検証した後、出力直前に変換する。"
  empty_to_none: "空文字列を文字列noneへ変換。それ以外はそのまま。"
  normalize_space_list: "空白区切りの値をASCIIスペース1個で連結。重複は先頭を保持して除去。"
  shell_script_base64: >-
    入力のUTF-8バイト列（改行を含む）をBase64で1行に変換し、
    printf '%s' '<BASE64>' | base64 -d | /bin/sh の形で出力する。
    13.5のinitrdはbase64コマンドを含む。生成時にシェルは実行しない。
    子の/bin/shで実行するため、終了コードはこのシェルの終了コードとなる。

# 検証は設定ファイルの読込時・回答時・cfg出力前に行う。実装は未着手。
validation_contract:
  schema:
    - "id・catalogのvalueの重複、参照先不存在、循環依存、未登録の処理名はエラー。"
    - "noneと各preseed出力は値の指定方法を1つだけ持つ。"
    - "選択値は候補内に限定し、条件が偽の回答は出力へ持ち越さない。"
  values:
    - "requiredは空入力不可。空を許す項目でもNUL・CR・改行は拒否（textはLFのみ許可）。"
    - "ipv4_netmaskは連続したビットのドット区切りIPv4マスク。CIDR値をそのまま出力しない。"
    - "IPv4のアドレス／マスク／ゲートウェイを組として確認する。DNSは空白区切りIPv4のみ。"
    - "hostname_labelはASCIIホスト名1ラベル、dns_nameはDNSホスト名。任意URLとは区別する。"
    - "linux_whole_disk_pathは/dev以下の単一の全ディスク指定。パーティション指定・空白入りを拒否。"
    - "partman_capacityは正の数値と対応単位（例: 20 GB）。ディスク実容量は生成時に保証できない。"
    - "debian_binary_package_listはDebianバイナリパッケージ名の空白区切り。空入力可。"
    - "URL／パス／NIC名は起動引数への直列化も検証する。入力をそのままシェルに挿入しない。"
  accounts: "root_login=falseの場合はcreate_user=trueが必須。パスワードは空にできない。"
  secrets: "パスワード・プロキシ認証情報・URLの秘密値を回答一覧やログに表示しない。回答済みパスワードを雛形に保存しない。"

output:
  cfg:
    suggested_filename: preseed.cfg
    header: "#_preseed_V1"
    format: "owner key type value"
    notes:
      - "ownerとtypeをキーごとに保持。string/select/passwordは文字列、booleanは真偽値、noteは空値。"
      - "キーの重複は同時に有効な出力でのみエラー。排他的な条件なら同じキーを定義できる。"
      - "単純な文字列にCR/LF/NULを混入させない。late_commandは専用変換で1行化する。"
  boot_arguments:
    base: ["auto=true", "priority=critical"]
    file:
      key: preseed/file
      value_from: preseed_file_path
    url:
      key: preseed/url
      value_from: preseed_url
      network_before_fetch:
        - {key: netcfg/choose_interface, value_from: network_interface}
        - {key: netcfg/disable_autoconfig, value_from: static_ipv4}
        - {key: netcfg/get_ipaddress, value_from: ipv4_address, when: {setting: static_ipv4, equals: true}}
        - {key: netcfg/get_netmask, value_from: ipv4_netmask, when: {setting: static_ipv4, equals: true}}
        - {key: netcfg/get_gateway, value_from: ipv4_gateway, transform: empty_to_none, when: {setting: static_ipv4, equals: true}}
        - {key: netcfg/get_nameservers, value_from: ipv4_nameservers, transform: normalize_space_list, when: {setting: static_ipv4, equals: true}}
        - {key: netcfg/confirm_static, value: true, when: {setting: static_ipv4, equals: true}}
        - {key: netcfg/get_hostname, value_from: hostname}
        - {key: netcfg/hostname, value_from: hostname}
        - {key: netcfg/get_domain, value_from: domain}
    notes:
      - "URL取得より前のネットワーク設定はcfgのみでは間に合わないため起動引数にも反映。"
      - "auto=trueで地域設定の質問をcfg読み込み後へ遅らせる。無関係なlocaleを起動引数に固定しない。"
      - "スペースを含むDNS等の値、空値、URLはDebianの起動引数規則で引用する。"
      - "長さとカーネル引数数の制限を検査。ブートローダーへの貼り付け方法は方式ごとに検証する。"
      - "ISO再作成・ファイル配置・配布サーバー構築は行わず、cfgと起動引数の例を生成する。"

verification:
  yaml_syntax: checked
  catalog_references: checked
  catalog_source: "13.5 ISO内データ／収録版と同じudeb"
  generator_implementation: pending
  preseed_syntax: pending
  vm_installation_bios: pending
  vm_installation_uefi: pending

